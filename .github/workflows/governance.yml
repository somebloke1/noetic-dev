name: Governance

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  actions: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation (candidate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py

  workflow-pinning:
    name: Workflow pinning validation (candidate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate all workflow refs are immutable
        run: python3 scripts/governance/check_delivery_gate.py --check-pinning-only .github/workflows

  tests:
    name: Genuine tests (candidate)
    runs-on: ubuntu-latest
    needs: [validate, workflow-pinning]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Run genuine governance tests
        run: python3 -m unittest discover -s tests -v

  bootstrap-honesty:
    name: Bootstrap honesty (advisory, fail-closed)
    runs-on: ubuntu-latest
    needs: [validate, workflow-pinning, tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm advisory bootstrap remains blocked
        run: python3 scripts/governance/check_delivery_gate.py --check-bootstrap-blocked
      - name: State non-authority explicitly
        run: |
          echo "Candidate workflow provides validation, tests, and advisory diagnostics only."
          echo "Merge/publication authority requires a separately protected required workflow or repository integration."

  post-merge-validation:
    name: Post-merge validation (protected branch, no publication)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout protected branch SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Post-merge repository validation
        run: python3 scripts/validate_repo.py
      - name: Install Bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Post-merge genuine tests
        run: python3 -m unittest discover -s tests -v
      - name: Confirm publication remains blocked pending protected evidence
        run: python3 scripts/governance/check_delivery_gate.py --check-bootstrap-blocked
