name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  actions: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation (candidate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py

  tests:
    name: Genuine tests (candidate)
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run genuine governance tests
        run: python3 -m unittest discover -s tests -v

  post-merge-validation:
    name: Branch validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout branch SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Post-merge repository validation
        run: python3 scripts/validate_repo.py
      - name: Post-merge genuine tests
        run: python3 -m unittest discover -s tests -v
