name: Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Validate controller specifications
        run: python3 scripts/validate_controller_specs.py
      - name: Validate cognitional event specifications
        run: python3 scripts/validate_event_specs.py
      - name: Validate Telos delegation specifications
        run: python3 scripts/validate_telos_specs.py
      - name: Validate ContextForge continuity inventory
        run: python3 scripts/validate_contextforge_inventory.py
      - name: Validate model selection/access specifications
        run: python3 scripts/validate_model_specs.py
      - name: Verify clean patch formatting
        run: git diff --check HEAD^
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
