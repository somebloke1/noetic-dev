name: Agent Review

on:
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    name: agent-review
    runs-on: [self-hosted, noetic-dev, terra-review]
    timeout-minutes: 20
    steps:
      - name: Checkout protected policy SHA only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: policy
      - name: Enforce local-runner admission policy
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          test "$PR_DRAFT" = "false"
          test "$PR_HEAD_REPOSITORY" = "$REPOSITORY"
          test "$PR_AUTHOR" = "$REPOSITORY_OWNER"
      - name: Request immutable semantic review
        env:
          NOETIC_AGENT_REVIEW_SOCKET: /run/noetic-dev/agent-review.sock
        run: >-
          python3 policy/scripts/governance/request_agent_review.py
          --repository "${{ github.repository }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --output "$RUNNER_TEMP/agent-review-result.json"
      - name: Retain exact-SHA route evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/agent-review-result.json
          retention-days: 90
